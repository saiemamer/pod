name: Pod release (macOS, unsigned)

# Why a separate workflow from upstream's release-mac-build.yml: that one needs
# Stably's runners, Apple signing secrets, and a draft release created by
# release-cut. Pod builds unsigned on a GitHub-hosted macos-15 runner (the
# Computer Use helper needs Swift 6, which macOS 13 dev machines cannot build)
# and publishes straight to the tag's GitHub release, which is also the
# electron-updater feed (see src/shared/brand.ts).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pod-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # Why stamp instead of commit: upstream bumps package.json's version in every
      # release, so a committed Pod version would conflict on every rebase.
      - name: Stamp the Pod version from the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "$version" =~ ^0\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $TAG is not a Pod 0.x.y version tag"
            exit 1
          fi
          npm pkg set version="$version"
          echo "Building Pod $version on Orca $(node -p "require('./config/pod-brand.cjs').upstreamBaseTag")"

      - name: Verify macOS entitlements
        run: pnpm verify:macos-entitlements

      - name: Build app
        run: pnpm build:release
        env:
          ORCA_BUILD_IDENTITY: stable

      - name: Package and publish (unsigned)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_wait_seconds: 30
          command: node config/scripts/ensure-native-runtime.mjs --runtime=electron && pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Why: no Developer ID yet. Unsigned apps open via right-click, Open.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Why: the 0.1.0 build shipped with Orca's feed and a CLI wrapper that could not
      # find the Pod binary; both are only visible in the packaged bundle.
      - name: Verify the packaged app updates from Pod and its CLI starts
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          app="$(find dist -maxdepth 2 -name 'Pod.app' -type d | head -1)"
          test -n "$app" || { echo "::error::No Pod.app under dist/"; exit 1; }
          grep -q '^owner: saiemamer$' "$app/Contents/Resources/app-update.yml"
          grep -q '^repo: pod$' "$app/Contents/Resources/app-update.yml"
          cli_version="$("$app/Contents/Resources/bin/orca" --version)"
          test "$cli_version" = "${TAG#v}" || { echo "::error::Bundled CLI reports $cli_version, tag is $TAG"; exit 1; }
          echo "Packaged app updates from saiemamer/pod; bundled CLI reports $cli_version"

      # Why: 0.1.8 and 0.1.9 packaged fine and exited at startup on a missing
      # main-process dependency; only launching the built app catches that.
      - name: Verify the packaged app starts
        shell: bash
        run: |
          set -euo pipefail
          app="$(find dist -maxdepth 2 -name 'Pod.app' -type d | head -1)"
          log="$RUNNER_TEMP/pod-launch.log"
          "$app/Contents/MacOS/Pod" > "$log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::Pod exited within 20 s of launch"; cat "$log"; exit 1
          fi
          if grep -q 'fatal-exit' "$log"; then
            echo "::error::Pod reported a fatal exit"; cat "$log"; exit 1
          fi
          kill "$pid" || true
          echo "Packaged app stayed up for 20 s"

      - name: Summary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Pod $TAG"
            echo
            gh release view "$TAG" --json assets --jq '.assets[] | "- " + .name + " (" + (.size|tostring) + " bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"
