name: Pod release (macOS, unsigned)

# Why a separate workflow from upstream's release-mac-build.yml: that one needs
# Stably's runners, Apple signing secrets, and a draft release created by
# release-cut. Pod builds unsigned on a GitHub-hosted macos-15 runner (the
# Computer Use helper needs Swift 6, which macOS 13 dev machines cannot build)
# and publishes straight to the tag's GitHub release, which is also the
# electron-updater feed (see src/shared/brand.ts).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pod-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # Why stamp instead of commit: upstream bumps package.json's version in every
      # release, so a committed Pod version would conflict on every rebase.
      - name: Stamp the Pod version from the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "$version" =~ ^0\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $TAG is not a Pod 0.x.y version tag"
            exit 1
          fi
          npm pkg set version="$version"
          echo "Building Pod $version on Orca $(node -p "require('./config/pod-brand.cjs').upstreamBaseTag")"

      - name: Verify macOS entitlements
        run: pnpm verify:macos-entitlements

      - name: Build app
        run: pnpm build:release
        env:
          ORCA_BUILD_IDENTITY: stable

      - name: Package and publish (unsigned)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_wait_seconds: 30
          command: node config/scripts/ensure-native-runtime.mjs --runtime=electron && pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Why: no Developer ID yet. Unsigned apps open via right-click, Open.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Summary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Pod $TAG"
            echo
            gh release view "$TAG" --json assets --jq '.assets[] | "- " + .name + " (" + (.size|tostring) + " bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"
