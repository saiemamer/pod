name: Pod release (macOS, unsigned)

# Why a separate workflow from upstream's release-mac-build.yml: that one needs
# Stably's runners, Apple signing secrets, and a draft release created by
# release-cut. Pod builds unsigned on a GitHub-hosted macos-15 runner (the
# Computer Use helper needs Swift 6, which macOS 13 dev machines cannot build)
# and publishes straight to the tag's GitHub release, which is also the
# electron-updater feed (see src/shared/brand.ts).
#
# mode=trial builds and packages the dispatched branch as 0.0.0-trial.<run number>
# and runs the packaged-app checks, but packages with --publish never, gets no
# token for packaging and skips every release step, so it publishes nothing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: release publishes the tag; trial builds the dispatched branch and publishes nothing
        required: false
        default: release
        type: choice
        options:
          - release
          - trial
      tag:
        description: Existing tag to build in release mode (for example v0.1.0); leave empty for trial
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pod-release-${{ inputs.mode == 'trial' && format('trial-{0}', github.ref_name) || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Resolve the Pod version
        id: target
        shell: bash
        env:
          MODE: ${{ inputs.mode || 'release' }}
          TAG_INPUT: ${{ inputs.tag }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "trial" ]]; then
            test -z "$TAG_INPUT" || { echo "::error::A trial builds the dispatched branch; leave tag empty"; exit 1; }
            test "$REF_TYPE" = "branch" || { echo "::error::Dispatch a trial on a branch, not a $REF_TYPE"; exit 1; }
            version="0.0.0-trial.$RUN_NUMBER"
          else
            test -n "$TAG" || { echo "::error::Release mode needs a tag"; exit 1; }
            version="${TAG#v}"
          fi
          if [[ ! "$version" =~ ^0\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $TAG is not a Pod 0.x.y version tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Mode $MODE, Pod $version"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          # Why both CPUs: the mac config packages x64 and arm64 from this arm64 runner,
          # and beforePack fails a slice whose sherpa-onnx or @parcel/watcher variant is missing.
          command: pnpm install --frozen-lockfile --cpu=current,x64,arm64

      # Why: build:release ends with build:mobile-web, which resolves React Native and
      # Expo from mobile/node_modules, and beforePack requires its out/mobile-web bundle.
      - name: Install mobile dependencies
        uses: ./.github/actions/install-mobile-dependencies

      # Why stamp instead of commit: upstream bumps package.json's version in every
      # release, so a committed Pod version would conflict on every rebase.
      - name: Stamp the Pod version
        shell: bash
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          npm pkg set version="$VERSION"
          echo "Building Pod $VERSION on Orca $(node -p "require('./config/pod-brand.cjs').upstreamBaseTag")"

      - name: Verify macOS entitlements
        run: pnpm verify:macos-entitlements

      - name: Build app
        run: pnpm build:release
        env:
          ORCA_BUILD_IDENTITY: stable

      # Why: electron-builder publishes the x64 and arm64 targets in parallel and
      # each created its own release when none existed, so every tag carried two
      # releases and the DMGs sat on whichever came second (0.1.10's download URL
      # 404ed). One draft made here is what both targets attach to.
      - name: Create the draft release
        if: inputs.mode != 'trial'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            gh release create "$TAG" --draft --title "${TAG#v}" --notes "Pod ${TAG#v}"
          fi

      - name: Package, and publish in release mode (unsigned)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_wait_seconds: 30
          command: node config/scripts/ensure-native-runtime.mjs --runtime=electron && pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish ${{ inputs.mode == 'trial' && 'never' || 'always' }}
        env:
          GH_TOKEN: ${{ inputs.mode != 'trial' && secrets.GITHUB_TOKEN || '' }}
          # Why: no Developer ID yet. Unsigned apps open via right-click, Open.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Why: the 0.1.0 build shipped with Orca's feed and a CLI wrapper that could not
      # find the Pod binary; both are only visible in the packaged bundle.
      - name: Verify the packaged app updates from Pod and its CLI starts
        shell: bash
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          apps="$(find dist -maxdepth 2 -name 'Pod.app' -type d | sort)"
          test -n "$apps" || { echo "::error::No Pod.app under dist/"; exit 1; }
          for app in $apps; do
            grep -q '^owner: saiemamer$' "$app/Contents/Resources/app-update.yml"
            grep -q '^repo: pod$' "$app/Contents/Resources/app-update.yml"
            cli_version="$("$app/Contents/Resources/bin/orca" --version)"
            test "$cli_version" = "$VERSION" || { echo "::error::$app: bundled CLI reports $cli_version, expected $VERSION"; exit 1; }
            echo "$app updates from saiemamer/pod; bundled CLI reports $cli_version"
          done

      # Why: column lineage imports the sqlglot Pod ships (resources/pod-sqlglot); a
      # build that leaves it out falls back to name matching on laptops without sqlglot.
      - name: Verify the packaged apps carry sqlglot
        shell: bash
        run: |
          set -euo pipefail
          apps="$(find dist -maxdepth 2 -name 'Pod.app' -type d | sort)"
          count="$(printf '%s\n' "$apps" | grep -c . || true)"
          test "$count" -ge 2 || { echo "::error::expected a Pod.app per architecture, found $count"; exit 1; }
          empty="$(mktemp -d)"
          for app in $apps; do
            dir="$PWD/$app/Contents/Resources/app.asar.unpacked/resources/pod-sqlglot"
            test -f "$dir/sqlglot/__init__.py" || { echo "::error::$app has no pod-sqlglot/sqlglot/__init__.py"; exit 1; }
            test -f "$dir/LICENSE" || { echo "::error::$app has no pod-sqlglot/LICENSE"; exit 1; }
            # Run from an empty folder so no other copy can answer; fail unless this one did.
            got="$(cd "$empty" && PYTHONPATH="$dir" PYTHONDONTWRITEBYTECODE=1 python3 -c "import sqlglot, sys; assert sqlglot.__file__.startswith(sys.argv[1] + '/'), sqlglot.__file__; print(sqlglot.__version__)" "$dir")"
            test "$got" = "30.21.0" || { echo "::error::$app: sqlglot from $dir reports $got, expected 30.21.0"; exit 1; }
            echo "$app imports sqlglot $got from $dir"
          done

      # Why: 0.1.8 and 0.1.9 packaged fine and exited at startup on a missing
      # main-process dependency; only launching the built apps catches that. The
      # release is still a draft here, so a failure ships nothing.
      - name: Verify the packaged apps start
        shell: bash
        run: |
          set -euo pipefail
          for app in $(find dist -maxdepth 2 -name 'Pod.app' -type d | sort); do
            log="$RUNNER_TEMP/pod-launch-$(basename "$(dirname "$app")").log"
            "$app/Contents/MacOS/Pod" > "$log" 2>&1 &
            pid=$!
            sleep 20
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::$app exited within 20 s of launch"; cat "$log"; exit 1
            fi
            if grep -q 'fatal-exit' "$log"; then
              echo "::error::$app reported a fatal exit"; cat "$log"; exit 1
            fi
            kill "$pid" || true
            sleep 3
            echo "$app stayed up for 20 s"
          done

      # Why last: the draft becomes visible to users and to the tap's bump job only
      # after the built apps proved they start.
      - name: Publish the release
        if: inputs.mode != 'trial'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" --jq "[.[] | select(.tag_name == \"$TAG\")] | length")"
          test "$count" = "1" || { echo "::error::$count releases carry tag $TAG"; exit 1; }
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for name in pod-macos-x64.dmg pod-macos-arm64.dmg latest-mac.yml; do
            grep -qx "$name" <<< "$assets" || { echo "::error::$name is missing from the draft"; exit 1; }
          done
          gh release edit "$TAG" --draft=false --latest
          echo "published $TAG with: $(tr '\n' ' ' <<< "$assets")"

      - name: Summary
        if: inputs.mode != 'trial'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Pod $TAG"
            echo
            gh release view "$TAG" --json assets --jq '.assets[] | "- " + .name + " (" + (.size|tostring) + " bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trial summary
        if: inputs.mode == 'trial'
        shell: bash
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## Pod trial $VERSION from ${GITHUB_REF_NAME} (nothing published)"
            echo
            find dist -maxdepth 1 -name '*.dmg' -exec stat -f '- %N (%z bytes)' {} \;
          } >> "$GITHUB_STEP_SUMMARY"
